{% extends "base.html" %}{% block content %}
<section class="hero"><h1>Sources et licences</h1>
<p>LibreCours PC privilégie les ressources dont les conditions de réutilisation sont explicites.</p></section>
<div class="grid">{% for s in sources %}<article class="card"><h2>{{s.name}}</h2><p>{{s.license}}</p>
